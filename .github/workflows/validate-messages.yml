name: Validate translations
on:
  push:
    paths: ['messages/**', 'scripts/validate-messages.mjs']
  pull_request:
    paths: ['messages/**', 'scripts/validate-messages.mjs']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run validate:messages
